[project]
name = "py-super-sample"
version = "0.1.0"
description = "Upscale images with Real-ESRGAN on Apple Silicon"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "spandrel>=0.4.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
upscale = "upscale:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["upscale.py"]
